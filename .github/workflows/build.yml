name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-countdown-windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
